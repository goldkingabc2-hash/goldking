name: Auto Update All M3U Playlists

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-all-playlists:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            python -m pip install --upgrade pip
            pip install -r requirements.txt
          fi

      - name: Run playlist update scripts
        shell: bash
        run: |
          set -e

          # Run every Python updater in the repository.
          # Each script is expected to create/update its matching .m3u file.
          shopt -s nullglob
          scripts=( *.py )

          if [ ${#scripts[@]} -eq 0 ]; then
            echo "No .py update scripts found."
            exit 0
          fi

          for script in "${scripts[@]}"; do
            echo "========================================"
            echo "Running: $script"
            echo "========================================"
            python "$script"
          done

      - name: Show updated M3U files
        run: |
          echo "M3U files in repository:"
          find . -maxdepth 1 -type f -iname '*.m3u' -print | sort

      - name: Commit and push updated M3U files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add '*.m3u'

          if git diff --cached --quiet; then
            echo "No M3U changes found."
          else
            git commit -m "Auto-update all M3U playlists"
            git push
          fi
