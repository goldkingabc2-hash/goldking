name: Auto Update M3U Playlists

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-m3u:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download latest M3U files
        shell: bash
        run: |
          set -e
          BASE='https://raw.githubusercontent.com/sportlive18/jio-tv-auto-update-playlist/refs/heads/main'
          curl -fL "$BASE/pocket.m3u" -o "pocket.m3u"
          curl -fL "$BASE/jtv.m3u" -o "jtv.m3u"
          curl -fL "$BASE/jtv2.m3u" -o "jtv2.m3u"
          curl -fL "$BASE/jtv3.m3u" -o "jtv3.m3u"
          curl -fL "$BASE/jtv4.m3u" -o "jtv4.m3u"
          curl -fL "$BASE/jtv5.m3u" -o "jtv5.m3u"
          curl -fL "$BASE/jtvplus.m3u" -o "jtvplus.m3u"
          curl -fL "$BASE/jtvplus2.m3u" -o "jtvplus2.m3u"
          curl -fL "$BASE/jtvplus3.m3u" -o "jtvplus3.m3u"
          curl -fL "$BASE/jtvplus4.m3u" -o "jtvplus4.m3u"
          curl -fL "$BASE/jtvplus5.m3u" -o "jtvplus5.m3u"
          curl -fL "$BASE/jtvplus6.m3u" -o "jtvplus6.m3u"
          curl -fL "$BASE/jtvplus7.m3u" -o "jtvplus7.m3u"
          curl -fL "$BASE/jtvplus8.m3u" -o "jtvplus8.m3u"
          curl -fL "$BASE/jtvplus9.m3u" -o "jtvplus9.m3u"

      - name: Commit updated M3U files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add *.m3u
          if git diff --cached --quiet; then
            echo 'No M3U changes.'
          else
            git commit -m 'Auto-update M3U playlists'
            git push
          fi
