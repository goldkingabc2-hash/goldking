name: Auto Update Pocket M3U

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update-pocket:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Pocket M3U
        run: |
          curl -L "https://raw.githubusercontent.com/sportlink10/playlist/refs/heads/main/pocket.m3u" -o Pocket.m3u

      - name: Commit Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Pocket.m3u

          if git diff --cached --quiet; then
            echo "No changes to Pocket.m3u"
            exit 0
          fi

          git commit -m "Auto update Pocket M3U"
          git push
