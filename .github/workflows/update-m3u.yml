name: Auto Update M3U

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download M3U
        run: |
          curl -L --fail \
            "https://raw.githubusercontent.com/sportlive18/playlist/refs/heads/main/pocket.m3u" \
            -o POCKET-TV.m3u

      - name: Check M3U
        run: |
          test -s POCKET-TV.m3u
          head -n 5 POCKET-TV.m3u

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add POCKET-TV.m3u
          git diff --cached --quiet || git commit -m "Auto update M3U"
          git push
