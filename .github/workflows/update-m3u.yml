name: Auto Update M3U

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download M3U
        run: |
          curl -L "https://raw.githubusercontent.com/goldkingabc2-hash/goldking/refs/heads/main/POCKET%20TV?token=GHSAT0AAAAAAEIKDWSBLN4A6K6GABB3E2L62VTL2LQ" -o "POCKET TV"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "POCKET TV"
          git diff --cached --quiet || git commit -m "Auto update M3U"
          git push
