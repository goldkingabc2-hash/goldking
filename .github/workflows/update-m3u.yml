name: Auto Update JioTVPlus4 Plus5

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download JioTVPlus4
        run: |
          curl -fL "https://raw.githubusercontent.com/Kalyan123407/STBPLUS/refs/heads/main/streamflex_fresh.m3u" -o JioTVPlus4.m3u

      - name: Download JioTVPlus5
        run: |
          curl -fL "https://raw.githubusercontent.com/purupc00-dev/Gmax-JioTV/refs/heads/main/Playlists/JioTV_S1.m3u" -o JioTVPlus5.m3u

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add JioTVPlus4.m3u JioTVPlus5.m3u

          if git diff --cached --quiet; then
            echo "No changes detected"
          else
            git commit -m "Auto update JioTVPlus4 and JioTVPlus5"
            git push
          fi
