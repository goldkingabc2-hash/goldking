name: Auto Update M3U

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download POCKET-TV
        run: |
          curl -L --fail \
            "https://raw.githubusercontent.com/sportlive18/playlist/refs/heads/main/pocket.m3u" \
            -o POCKET-TV.m3u

      - name: Download JioTVPlus
        run: |
          curl -L --fail \
            "https://raw.githubusercontent.com/maybetv/jojo/refs/heads/main/Jojo.m3u" \
            -o JioTVPlus.m3உ
                  - name: Download Tamil Movie
        run: |
          curl -L --fail \
            "https://raw.githubusercontent.com/Babuperumana/movies_m3u/refs/heads/main/playlist.m3u" \
            -o "Tamil Movie.m3u"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add POCKET-TV.m3u JioTVPlus.m3u

          if git diff --cached --quiet; then
            echo "No changes detected"
          else
            git commit -m "Auto update M3U playlists"
            git push
          fi
