name: M3U Auto Update

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update-playlists:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download M3U playlists
        run: |
          set -e

          curl -L --fail -o pocket.m3u \
            "https://raw.githubusercontent.com/sportlink10/playlist/refs/heads/main/pocket.m3u"

          curl -L --fail -o jtv.m3u \
            "https://raw.githubusercontent.com/sportlink10/playlist/refs/heads/main/jtv.m3u"

          curl -L --fail -o jtv2.m3u \
            "https://raw.githubusercontent.com/sportlink10/playlist/refs/heads/main/jtv2.m3u"

          curl -L --fail -o jtvplus2.m3u \
            "https://raw.githubusercontent.com/sportlink10/playlist/refs/heads/main/jtvplus2.m3u"

          curl -L --fail -o jtvplus3.m3u \
            "https://raw.githubusercontent.com/sportlink10/playlist/refs/heads/main/jtvplus3.m3u"

          curl -L --fail -o jtvplus5.m3u \
            "https://raw.githubusercontent.com/sportlink10/playlist/refs/heads/main/jtvplus5.m3u"

          curl -L --fail -o jtvplus6.m3u \
            "https://raw.githubusercontent.com/sportlink10/playlist/refs/heads/main/jtvplus6.m3u"

          curl -L --fail -o jtvplus7.m3u \
            "https://raw.githubusercontent.com/sportlink10/playlist/refs/heads/main/jtvplus7.m3u"

          curl -L --fail -o jtvplus9.m3u \
            "https://raw.githubusercontent.com/sportlink10/playlist/refs/heads/main/jtvplus9.m3u"

      - name: Check downloaded files
        run: |
          echo "Downloaded M3U files:"
          ls -lh *.m3u

      - name: Commit updated playlists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add *.m3u

          if git diff --cached --quiet; then
            echo "No playlist changes."
          else
            git commit -m "Auto update M3U playlists"
            git push
          fi
