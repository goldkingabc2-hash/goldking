name: M3U Auto Update

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-m3u:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download M3U playlists
        run: |
          curl -L "SOURCE_URL_1" -o pocket.m3u
          curl -L "SOURCE_URL_2" -o jtv.m3u
          curl -L "SOURCE_URL_3" -o jtv1.m3u
          curl -L "SOURCE_URL_4" -o jtv2.m3u
          curl -L "SOURCE_URL_5" -o jtv3.m3u
          curl -L "SOURCE_URL_6" -o jtv4.m3u
          curl -L "SOURCE_URL_7" -o jtv5.m3u
          curl -L "SOURCE_URL_8" -o jtvplus.m3u

      - name: Commit updated playlists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.m3u
          git diff --cached --quiet || git commit -m "Auto update M3U playlists"
          git push
